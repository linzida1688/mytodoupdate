        let renderedWordCount = 0;
        const WORDS_PER_PAGE = 80;
        let filteredUnmasteredWords = [];

        // 获取并结合用户导入的英语词汇
        function getCombinedVocabDb() {
            let list = JSON.parse(localStorage.getItem('todo_custom_words')) || [];
            if (list.length === 0) {
                list = defaultWords;
            }
            return list;
        }

        // 初始化加载学习状态
        function loadLearningState() {
            userVocabDb = getCombinedVocabDb();
            memoryStates = JSON.parse(localStorage.getItem('canvas_todo_vocab_states')) || {};
            studyMode = localStorage.getItem('canvas_todo_study_mode') || 'main';
            totalWordCountLabel.textContent = userVocabDb.length;
        }

        function saveLearningState() {
            localStorage.setItem('canvas_todo_vocab_states', JSON.stringify(memoryStates));
            localStorage.setItem('canvas_todo_study_mode', studyMode);
            totalWordCountLabel.textContent = userVocabDb.length;
        }

        // 顺序扫描并自动跳过已掌握(mastered)的词
        function skipMasteredWords() {
            let wordIndex = parseInt(localStorage.getItem('todo_word_index')) || 0;
            const total = userVocabDb.length;
            if (total === 0) return 0;

            let initialIndex = wordIndex;
            while (wordIndex < total) {
                const wordObj = userVocabDb[wordIndex];
                if (!wordObj) break;
                const state = memoryStates[wordObj.word];
                if (state && state.status === 'mastered') {
                    wordIndex++;
                } else {
                    break;
                }
            }

            // 越界保护，若越界返回开头重新检索，防丢，实现闭环
            if (wordIndex >= total) {
                wordIndex = 0;
                while (wordIndex < initialIndex) {
                    const wordObj = userVocabDb[wordIndex];
                    if (!wordObj) break;
                    const state = memoryStates[wordObj.word];
                    if (state && state.status === 'mastered') {
                        wordIndex++;
                    } else {
                        break;
                    }
                }
            }

            localStorage.setItem('todo_word_index', wordIndex);
            return wordIndex;
        }

        // 丝滑展现当前生词卡片（断点记忆与模式分离）
        function renderNextWord() {
            isDetailsRevealed = false;
            if (vocabDetailsContainer) {
                vocabDetailsContainer.classList.remove('revealed');
            }

            const now = Date.now();

            // 双核模式切换器高亮同步
            const modeBtnMain = document.getElementById('modeBtnMain');
            const modeBtnReview = document.getElementById('modeBtnReview');
            if (studyMode === 'main') {
                modeBtnMain.classList.add('active');
                modeBtnReview.classList.remove('active');
            } else {
                modeBtnMain.classList.remove('active');
                modeBtnReview.classList.add('active');
            }

            // 统计待复习到期单词数
            const dueReviewCount = userVocabDb.filter(w => {
                const state = memoryStates[w.word];
                return state && state.status === 'reviewing' && state.nextReviewTime <= now;
            }).length;

            const totalReviewingCount = userVocabDb.filter(w => {
                const state = memoryStates[w.word];
                return state && state.status === 'reviewing';
            }).length;

            document.getElementById('reviewQueueCount').textContent = dueReviewCount;

            if (studyMode === 'main') {
                // --- 主进度背词模式 ---
                const totalWords = userVocabDb.length;
                let wordIndex = skipMasteredWords();

                if (totalWords === 0) {
                    vocabCard.style.pointerEvents = 'none';
                    vocabCard.innerHTML = `
                        <div class="vocab-empty-state">
                            <i class="ph-bold ph-folder-open vocab-empty-icon"></i>
                            <div class="vocab-empty-title">暂无词汇数据</div>
                            <div class="vocab-empty-desc">请通过主页右下角“导入词库”上传你的单词列表。</div>
                        </div>
                    `;
                    vocabBtnDontKnow.disabled = true;
                    vocabBtnKnow.disabled = true;
                    currentActiveWord = null;
                    return;
                }

                const allMastered = userVocabDb.every(w => memoryStates[w.word] && memoryStates[w.word].status === 'mastered');
                if (allMastered) {
                    vocabCard.style.pointerEvents = 'none';
                    vocabCard.innerHTML = `
                        <div class="vocab-empty-state">
                            <i class="ph-bold ph-trophy vocab-empty-icon"></i>
                            <div class="vocab-empty-title">🎉 恭喜通关！所有词汇均已掌握完毕</div>
                            <div class="vocab-empty-desc">你可以导入新词本，或点击“词汇管理”查看。</div>
                        </div>
                    `;
                    vocabBtnDontKnow.disabled = true;
                    vocabBtnKnow.disabled = true;
                    currentActiveWord = null;
                    return;
                }

                // 进度条：只反应一轮通刷的主进度
                vocabProgressText.textContent = `主进度: ${wordIndex + 1} / ${totalWords}`;
                const progressPercent = totalWords > 0 ? ((wordIndex + 1) / totalWords) * 100 : 0;
                vocabProgressBar.style.width = `${progressPercent}%`;

                vocabCard.style.pointerEvents = 'auto';
                vocabBtnDontKnow.disabled = false;
                vocabBtnKnow.disabled = false;

                currentActiveWord = userVocabDb[wordIndex];
            } else {
                // --- 到期复习模式 ---
                const dueWords = userVocabDb.filter(w => {
                    const state = memoryStates[w.word];
                    return state && state.status === 'reviewing' && state.nextReviewTime <= now;
                });

                vocabProgressText.textContent = `待复习到期: ${dueWords.length} 个 (复习池中总计: ${totalReviewingCount} 个)`;
                vocabProgressBar.style.width = `${totalReviewingCount > 0 ? (1 - dueWords.length / totalReviewingCount) * 100 : 100}%`;

                if (dueWords.length === 0) {
                    vocabCard.style.pointerEvents = 'none';

                    // 检索出复习队列中即将最先到期的卡片，友好提醒
                    const allReviewing = userVocabDb.filter(w => memoryStates[w.word] && memoryStates[w.word].status === 'reviewing');
                    let timeHint = "当前没有排队的复习生词。在主进度点击“不认识”即可安排复习。";
                    if (allReviewing.length > 0) {
                        const nextDueTime = Math.min(...allReviewing.map(w => memoryStates[w.word].nextReviewTime));
                        const diffSecs = Math.max(0, Math.round((nextDueTime - now) / 1000));
                        if (diffSecs > 3600) {
                            timeHint = `距离下一个待复习卡片到期还有大约 ${Math.round(diffSecs / 3600)} 小时`;
                        } else if (diffSecs > 60) {
                            timeHint = `距离下一个待复习卡片到期还有大约 ${Math.round(diffSecs / 60)} 分钟`;
                        } else {
                            timeHint = `距离下一个待复习卡片到期还有大约 ${diffSecs} 秒`;
                        }
                    }

                    vocabCard.innerHTML = `
                        <div class="vocab-empty-state">
                            <i class="ph-bold ph-calendar-check vocab-empty-icon" style="color: #4ade80;"></i>
                            <div class="vocab-empty-title">👏 收工！到期的单词均已全部复习完毕</div>
                            <div class="vocab-empty-desc">${timeHint}</div>
                        </div>
                    `;
                    vocabBtnDontKnow.disabled = true;
                    vocabBtnKnow.disabled = true;
                    currentActiveWord = null;
                    return;
                }

                vocabCard.style.pointerEvents = 'auto';
                vocabBtnDontKnow.disabled = false;
                vocabBtnKnow.disabled = false;

                // 排序，优先处理最远最早超时的到期生词
                dueWords.sort((a, b) => memoryStates[a.word].nextReviewTime - memoryStates[b.word].nextReviewTime);
                currentActiveWord = dueWords[0];
            }

            if (!currentActiveWord) return;

            // 完全重绘卡片内部，防止 DOM 状态发生错乱
            vocabCard.innerHTML = `
                <div class="vocab-word" id="vocabCardWord" style="color:#4ade80 !important">${currentActiveWord.word}</div>
                <div class="vocab-phonetic-row">
                    <span id="vocabCardPhonetic">${currentActiveWord.phonetic || '/ - /'}</span>
                    <button class="vocab-speaker-btn" id="vocabCardSpeakBtn" title="点击播放发音"><i class="ph-bold ph-speaker-high"></i></button>
                </div>
                <div class="vocab-details-container" id="vocabDetailsContainer">
                    <div class="vocab-trans-text" id="vocabCardTrans" style="color:#ffffff !important">${currentActiveWord.trans}</div>
                    <div class="vocab-sentence-box" id="vocabSentenceBox" style="display:${(currentActiveWord.sentence) ? 'block' : 'none'};">
                        <div class="vocab-sentence-en" id="vocabCardSentenceEn">${currentActiveWord.sentence || ''}</div>
                        <div class="vocab-sentence-zh" id="vocabCardSentenceZh">${currentActiveWord.sentenceTrans || ''}</div>
                    </div>
                </div>
                <div class="vocab-click-hint" id="vocabClickHint"><i class="ph ph-hand-tap"></i> 点击卡片任意处显现翻译</div>
            `;

            const detailContainer = vocabCard.querySelector('#vocabDetailsContainer');
            vocabCard.onclick = () => {
                isDetailsRevealed = true;
                detailContainer.classList.add('revealed');
            };

            vocabCard.querySelector('#vocabCardSpeakBtn').onclick = (e) => {
                e.stopPropagation();
                playAudio(currentActiveWord.word);
            };

            // 完美瞬间触发真人发音
            playAudio(currentActiveWord.word);
        }

        // 处理认识与不认识卡片交互核心（双模式多频算法）
        function processLearningResponse(isKnow) {
            if (!currentActiveWord) return;
            const word = currentActiveWord.word;
            playPop();

            // 自适应动力学翻卡划过特效
            vocabCard.style.transform = isKnow ? 'translateX(100px) rotate(10deg) scale(0.95)' : 'translateX(-100px) rotate(-10deg) scale(0.95)';
            vocabCard.style.opacity = '0';

            setTimeout(() => {
                // 安全加载或重建生词状态
                if (!memoryStates[word]) {
                    memoryStates[word] = { reviewStage: 0, nextReviewTime: 0, status: 'learning' };
                }

                if (studyMode === 'main') {
                    // === 主进度：一直刷模式 ===
                    if (!isKnow) {
                        // 如果在主进度点击了“不认识”，立刻打入复习池，级别归零并立刻触发
                        memoryStates[word].status = 'reviewing';
                        memoryStates[word].reviewStage = 0;
                        memoryStates[word].nextReviewTime = Date.now(); 
                    }
                    
                    // 无论认不认识，主进度必定滑移至下一个单词，断点数据立刻保存
                    let wordIndex = parseInt(localStorage.getItem('todo_word_index')) || 0;
                    wordIndex++;
                    if (wordIndex >= userVocabDb.length) {
                        wordIndex = 0; // 通刷完循环复位
                    }
                    localStorage.setItem('todo_word_index', wordIndex);
                } else {
                    // === 智能到期复习模式（严格的艾宾浩斯 5 次巩固曲线算法） ===
                    if (isKnow) {
                        // 递增复习成功级别
                        memoryStates[word].reviewStage = (memoryStates[word].reviewStage || 0) + 1;
                        
                        if (memoryStates[word].reviewStage >= 5) {
                            // 认识满 5 次，彻底掌握并功德圆满地移出所有背词循环
                            memoryStates[word].status = 'mastered';
                        } else {
                            // 自适应复习时间计划：
                            // 1➔2: 1天； 2➔3: 3天； 3➔4: 6天； 4➔5: 7天
                            const intervals = [
                                0,
                                1 * 24 * 60 * 60 * 1000, // 第一次到第二次：1天
                                3 * 24 * 60 * 60 * 1000, // 第二次到第三次：3天
                                6 * 24 * 60 * 60 * 1000, // 第三次到第四次：6天
                                7 * 24 * 60 * 60 * 1000  // 第四次到第五次：7天
                            ];
                            const currentInterval = intervals[memoryStates[word].reviewStage] || (1 * 24 * 60 * 60 * 1000);
                            memoryStates[word].nextReviewTime = Date.now() + currentInterval;
                        }
                    } else {
                        // 在复习时点击“不认识”，重置等级，并且 10 秒后立刻在此复现重新背诵
                        memoryStates[word].reviewStage = 0;
                        memoryStates[word].nextReviewTime = Date.now() + 10 * 1000;
                    }
                }

                saveLearningState();

                vocabCard.style.transition = 'none';
                vocabCard.style.transform = 'translateY(15px) scale(0.95)';
                vocabCard.style.opacity = '0';
                
                renderNextWord();

                setTimeout(() => {
                    vocabCard.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s';
                    vocabCard.style.transform = 'translateY(0) scale(1)';
                    vocabCard.style.opacity = '1';
                }, 30);

            }, 250);
        }

        // 处理已掌握：打通并彻底同步删除主进度单词
        function setWordMastered(word) {
            if (!memoryStates[word]) {
                memoryStates[word] = { reviewStage: 5, nextReviewTime: 0, status: 'mastered' };
            } else {
                memoryStates[word].reviewStage = 5;
                memoryStates[word].status = 'mastered';
            }
            saveLearningState();
            rebuildLearningSession();
        }

        // 清空重置记忆曲线
        window.resetAllVocabMemory = () => {
            if (confirm("确定要彻底重置当前词本全部单词的记忆级别和复习规划吗？")) {
                memoryStates = {};
                localStorage.setItem('todo_word_index', '0');
                saveLearningState();
                rebuildLearningSession();
                renderNextWord();
            }
        };

        // 单词库高保真列表管理（支持：分页静默分批追载 + 点击即时自动发音 + 完美果冻消失离场）
        function renderVocabularyList(resetScroll = true) {
            if (resetScroll) {
                vocabListScroll.innerHTML = '';
                vocabListScroll.scrollTop = 0;
                renderedWordCount = 0;
            }
            
            const searchKey = vocabSearchInput.value.toLowerCase().trim();

            // 过滤未被彻底标记为已掌握(mastered)的词
            filteredUnmasteredWords = userVocabDb.filter(item => {
                if (!item || !item.word) return false;
                const isMastered = memoryStates[item.word] && memoryStates[item.word].status === 'mastered';
                if (isMastered) return false;

                if (searchKey) {
                    return item.word.toLowerCase().includes(searchKey) || item.trans.toLowerCase().includes(searchKey);
                }
                return true;
            });

            if (filteredUnmasteredWords.length === 0 && resetScroll) {
                vocabListScroll.innerHTML = `
                    <div class="empty-gallery">
                        <i class="ph ph-magnifying-glass" style="font-size: 28px;"></i>
                        <span>没有检索到未掌握单词<br>已背完或可导入自定义生词本</span>
                    </div>
                `;
                return;
            }

            appendMoreWords();
        }

        // 高效分批渲染函数（杜绝因一次性生成 2000+ DOM 节点导致的硬性卡顿）
        function appendMoreWords() {
            const nextWords = filteredUnmasteredWords.slice(renderedWordCount, renderedWordCount + WORDS_PER_PAGE);
            if (nextWords.length === 0) return;

            nextWords.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'word-list-item-wrapper';
                wrapper.dataset.word = item.word;

                // 完美还原英语绿色，中文高雅亮白色，并且默认为模糊磨砂状态
                wrapper.innerHTML = `
                    <div class="word-list-item">
                        <button class="word-list-sound-btn" title="播放发音"><i class="ph-bold ph-speaker-high"></i></button>
                        <div class="word-list-text-box">
                            <div class="word-list-term-row">
                                <span class="word-list-english" style="color: #4ade80 !important; font-weight: bold;">${item.word}</span>
                                <span class="word-list-phonetic">${item.phonetic || ''}</span>
                            </div>
                            <div class="word-list-trans" title="点击可显现/隐藏当前释义">${item.trans}</div>
                        </div>
                    </div>
                    <div class="mastered-slider-btn">已掌握</div>
                `;

                // 单条点击发音
                wrapper.querySelector('.word-list-sound-btn').onclick = (e) => {
                    e.stopPropagation();
                    playAudio(item.word);
                };

                // 核心交互：点击文本块切换解锁翻译模糊状态，并同步进行美音自动发音
                wrapper.querySelector('.word-list-text-box').onclick = (e) => {
                    e.stopPropagation();
                    const transEl = wrapper.querySelector('.word-list-trans');
                    const isRevealed = transEl.classList.toggle('revealed');
                    if (isRevealed) {
                        playAudio(item.word);
                    } else {
                        playPop(); // 划上遮罩时轻微反馈音
                    }
                };

                // 右侧绝对定位的“已掌握”按钮：瞬间触发丝滑果冻消失动画，无感完成后台同步
                wrapper.querySelector('.mastered-slider-btn').onclick = (e) => {
                    e.stopPropagation();
                    playPop();
                    
                    // 挂载果冻收缩形变离场类
                    wrapper.className = 'word-list-item-wrapper word-jelly-out';
                    
                    setTimeout(() => {
                        // 在离场动效结束后直接从 DOM 容器中物理移除
                        wrapper.remove();
                        setWordMastered(item.word);
                        
                        // 慢速局部减少词库总数标签，不需要重渲染全量列表，极其顺滑
                        const currentCount = parseInt(totalWordCountLabel.textContent) || 0;
                        if (currentCount > 0) {
                            totalWordCountLabel.textContent = currentCount - 1;
                        }
                        
                        // 从检索数组中动态裁剪，维护滚动的边界索引一致性
                        filteredUnmasteredWords = filteredUnmasteredWords.filter(w => w.word !== item.word);
                        renderedWordCount = Math.max(0, renderedWordCount - 1);
                    }, 400); // 严格对应 0.4s keyframe 动画时长
                };

                vocabListScroll.appendChild(wrapper);
            });

            renderedWordCount += nextWords.length;
        }

        // 绑定滚动监听，实现无感滚至底部自动加载下一页
        vocabListScroll.addEventListener('scroll', () => {
            if (vocabListScroll.scrollTop + vocabListScroll.clientHeight >= vocabListScroll.scrollHeight - 120) {
                appendMoreWords();
            }
        });

        // 查询搜索事件
        vocabSearchInput.addEventListener('input', () => {
            renderVocabularyList(true); // 搜索输入变更时重置并重新执行分页
        });

        // 页签切换及自适应复盘重载
        function switchLearningTab(tabName) {
            tabBtnStudy.classList.remove('active');
            tabBtnList.classList.remove('active');
            vocabStudyView.style.display = 'none';
            vocabListView.style.display = 'none';

            // 确保加载最新最强的数据状态
            loadLearningState();

            if (tabName === 'study') {
                tabBtnStudy.classList.add('active');
                vocabStudyView.style.display = 'flex';
                rebuildLearningSession();
                renderNextWord();
            } else {
                tabBtnList.classList.add('active');
                vocabListView.style.display = 'flex';
                renderVocabularyList(true);
            }
        }

        tabBtnStudy.addEventListener('click', () => switchLearningTab('study'));
        tabBtnList.addEventListener('click', () => switchLearningTab('list'));

        // 控制模式双向切换：主顺序刷词模式 vs 待复习到期模式
        const modeBtnMain = document.getElementById('modeBtnMain');
        const modeBtnReview = document.getElementById('modeBtnReview');
        modeBtnMain.addEventListener('click', () => {
            studyMode = 'main';
            saveLearningState();
            renderNextWord();
        });
        modeBtnReview.addEventListener('click', () => {
            studyMode = 'review';
            saveLearningState();
            renderNextWord();
        });

        vocabBtnDontKnow.addEventListener('click', () => processLearningResponse(false));
        vocabBtnKnow.addEventListener('click', () => processLearningResponse(true));

        function openLearningCenter() {
            galleryModal.classList.remove('show');
            historyModal.classList.remove('show');
            noteArchiveModal.classList.remove('show');
            radioContainer.classList.remove('show');
            radioToggleBtn.classList.remove('radio-active');
            
            // 完美继承并恢复之前的断点模式与状态
            loadLearningState();
            switchLearningTab('study');
            
            learningCenterModal.classList.add('show');
            flipContainer.classList.add('hide-flipper');
        }

        function closeLearningCenter() {
            learningCenterModal.classList.remove('show');
            flipContainer.classList.remove('hide-flipper');
        }

        function rebuildLearningSession() {
            loadLearningState();
        }

        function syncVocabToLearningCenter() {
            loadLearningState();
            rebuildLearningSession();
            if (learningCenterModal.classList.contains('show')) {
                renderNextWord();
                renderVocabularyList(true);
            }
        }

        learningCenterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                openLearningCenter();
            });
        });
        closeLearningCenterBtn.addEventListener('click', closeLearningCenter);

        // 页面初始化时，极速预装载并保存
        loadLearningState();
        // ==================== 🏆 全新英语背单词高颜值组件结束 ====================
        
        flipToNoteBtn.addEventListener('click', () => { 
            flipContainer.classList.add('flipped'); 
            setTimeout(() => { noteArea.focus(); }, 600); 
        });
        flipToTodoBtn.addEventListener('click', () => { flipContainer.classList.remove('flipped'); });

        let isPinned = localStorage.getItem('canvas_todo_pinned') === 'true';
        function updatePinState() {
            if (isPinned) {
                mainWidget.classList.add('pinned'); noteWidget.classList.add('pinned');
                pinBtns.forEach(btn => { btn.classList.add('pinned-active'); });
                const miniLockIcon = document.querySelector('#miniLockBtn i');
                if (miniLockIcon) {
                    miniLockIcon.className = 'ph-bold ph-lock';
                    document.getElementById('miniLockBtn').title = "解锁窗口";
                }
            } else {
                mainWidget.classList.remove('pinned'); noteWidget.classList.remove('pinned');
                pinBtns.forEach(btn => { btn.classList.remove('pinned-active'); });
                const miniLockIcon = document.querySelector('#miniLockBtn i');
                if (miniLockIcon) {
                    miniLockIcon.className = 'ph-bold ph-lock-open';
                    document.getElementById('miniLockBtn').title = "固定窗口";
                }
            }
            if (typeof ipcRenderer !== 'undefined') ipcRenderer.send('toggle-pin', isPinned);
        }
        updatePinState(); 
        pinBtns.forEach(btn => { btn.addEventListener('click', () => { isPinned = !isPinned; localStorage.setItem('canvas_todo_pinned', isPinned); updatePinState(); }); });

        document.getElementById('miniLockBtn').addEventListener('click', () => {
            isPinned = !isPinned;
            localStorage.setItem('canvas_todo_pinned', isPinned);
            updatePinState();
        });

        document.getElementById('miniCycleBtn').addEventListener('click', () => {
            isMinimalistLayout = false;
            localStorage.setItem('canvas_todo_minimalist_layout', 'false');
            applyTheme();
            renderTasks();
        });

        appTitle.value = localStorage.getItem('canvas_todo_title') || '2026任务';
        appTitle.addEventListener('input', () => localStorage.setItem('canvas_todo_title', appTitle.value));
        appTitle.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); appTitle.blur(); } });

        const miniTitleInput = document.getElementById('miniTitleInput');
        miniTitleInput.value = localStorage.getItem('canvas_todo_mini_title') || '日程';
        miniTitleInput.addEventListener('input', () => {
            localStorage.setItem('canvas_todo_mini_title', miniTitleInput.value);
        });
        miniTitleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                miniTitleInput.blur();
            }
        });

        function cnToInt(str) {
            if (!str) return 0;
            str = str.replace(/个/g, '').trim();
            if (str === '半') return 0.5;
            if (str.endsWith('半')) return cnToInt(str.replace('半', '')) + 0.5;
            if (/^\d+(\.\d+)?$/.test(str)) return parseFloat(str);
            const map = {'零':0, '一':1, '二':2, '两':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10};
            if (str.length === 1) return map[str] || 0;
            if (str.length === 2) {
                if (str[0] === '十') return 10 + (map[str[1]] || 0); 
                if (str[1] === '十') return (map[str[0]] || 0) * 10; 
            }
            if (str.length === 3 && str[1] === '十') return (map[str[0]] || 0) * 10 + (map[str[2]] || 0);
            
            const parsed = parseInt(str);
            return isNaN(parsed) ? 0 : parsed;
        }

        function parseTaskTime(text) {
            let targetDate = new Date();
            let isRecurring = text.includes('每天') || text.includes('每日');

            let relMatch = text.match(/(半|\d+(?:\.\d+)?(?:g?半)?|[一二两三四五六七八九十百]+(?:g?半)?)\s*个?(小时|小时候|时|钟头|分钟|分|天)(?:[之后内])?/);
            if (relMatch) {
                let num = cnToInt(relMatch[1]); let unit = relMatch[2]; let multiplier = 0;
                if (unit === '分钟' || unit === '分') multiplier = 60000;
                else if (unit === '小时' || unit === '小时候' || unit === '时' || unit === '钟头') multiplier = 3600000;
                else if (unit === '天') multiplier = 86400000;
                if (multiplier > 0) return { targetTime: Date.now() + num * multiplier, isRecurring };
            }

            let hasDate = false;
            let dateMatch = text.match(/(?:(\d+|[一二两三四五六七八九十百]+)年)?(\d+|[一二两三四五六七八九十]+)月(\d+|[一二两三四五六七八九十百]+)[号日]/);
            if (dateMatch) {
                hasDate = true; let m = cnToInt(dateMatch[2]); let d = cnToInt(dateMatch[3]);
                if (dateMatch[1]) targetDate.setFullYear(cnToInt(dateMatch[1]));
                targetDate.setMonth(m - 1, d);
            } else if (text.includes('后天')) { hasDate = true; targetDate.setDate(targetDate.getDate() + 2);
            } else if (text.includes('明天') || text.includes('明早') || text.includes('明晚')) { hasDate = true; targetDate.setDate(targetDate.getDate() + 1);
            } else if (text.includes('今天') || text.includes('今早') || text.includes('今晚')) { hasDate = true; 
            } else {
                let weekMatch = text.match(/(下+)?(?:星期|周|礼拜)([一二三四五六日天周1234567])/);
                if (weekMatch) {
                    hasDate = true;
                    let isNextWeek = !!weekMatch[1];
                    let nextWeekCount = weekMatch[1] ? weekMatch[1].length : 0;
                    let targetDayChar = weekMatch[2];
                    
                    const dayMap = {
                        '一': 1, '1': 1,
                        '二': 2, '2': 2,
                        '三': 3, '3': 3,
                        '四': 4, '4': 4,
                        '五': 5, '5': 5,
                        '六': 6, '6': 6,
                        '日': 7, '天': 7, '周': 7, '7': 7
                    };
                    let targetDayNum = dayMap[targetDayChar] || 1;
                    
                    let currentDayNum = new Date().getDay();
                    if (currentDayNum === 0) currentDayNum = 7; 
                    
                    let dayDiff = targetDayNum - currentDayNum;
                    
                    if (isNextWeek) {
                        dayDiff += 7 * nextWeekCount;
                    } else {
                        if (dayDiff <= 0) {
                            dayDiff += 7;
                        }
                    }
                    targetDate.setDate(targetDate.getDate() + dayDiff);
                }
            }

            let timeMatch = text.match(/(?:(早上|上午|中午|下午|晚上|夜里|凌晨|明早|今早|明晚|今晚)\s*)?(\d+|[一二两三四五六七八九十十一十二]+)(?:点|:|：)(\d+|[一二两三四五六七八九十]+)?(分|半)?/);
            if (!timeMatch) timeMatch = text.match(/(早上|上午|中午|下午|晚上|夜里|凌晨|明早|今早|明晚|今晚)?(\d+|[一二两三四五六七八九十十一十二]+)点/);
            
            if (timeMatch) {
                let period = timeMatch[1] || ''; let h = cnToInt(timeMatch[2]); let mStr = timeMatch[3]; let modifier = timeMatch[4]; let m = 0;
                if (modifier === '半') m = 30; else if (mStr) m = cnToInt(mStr);
                if ((period.includes('下午') || period.includes('晚上') || period.includes('夜里') || period.includes('明晚') || period.includes('今晚') || text.includes('下午') || text.includes('晚上')) && h < 12) { h += 12;
                } else if (h === 12 && (period.includes('早上') || period.includes('上午') || period.includes('凌晨'))) { h = 0; }
                targetDate.setHours(h, m, 0, 0);
                if (!hasDate && targetDate.getTime() <= Date.now() && !text.includes('今天') && !text.includes('今早') && !text.includes('今晚')) { targetDate.setDate(targetDate.getDate() + 1); }
                return { targetTime: targetDate.getTime(), isRecurring };
            }
            
            if (hasDate && !timeMatch) {
                if (text.includes('晚上')) targetDate.setHours(20, 0, 0, 0);
                else if (text.includes('下午')) targetDate.setHours(14, 0, 0, 0);
                else targetDate.setHours(9, 0, 0, 0);
                return { targetTime: targetDate.getTime(), isRecurring };
            }
            return { targetTime: null, isRecurring };
        }

        function updateOverallProgress() {
            const ring = document.getElementById('titleProgressRing');
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const circumference = 37.7; 
            if (total === 0) {
                ring.style.strokeDashoffset = circumference;
            } else {
                ring.style.strokeDashoffset = circumference - (circumference * completed / total);
            }
        }

        function renderTasks() {
            taskListEl.innerHTML = '';
            const now = Date.now();
            let needsSave = false;
            const activeTasks = tasks.filter(t => !t.completed);

            if (activeTasks.length === 0) {
                const h = new Date().getHours();
                let msg = h < 12 ? '☕ 开启专注的一天吧' : (h < 18 ? '🍃 喝口水，休息一下' : '🌙 任务清空，晚安');
                taskListEl.innerHTML = `<div class="empty-state">${msg}</div>`;
            }

            activeTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item glare-effect';
                li.draggable = true; li.dataset.id = task.id;

                let timeHtml = ''; let progressHtml = '';
                let recurIcon = task.recurring ? `<i class="ph-bold ph-arrows-clockwise" style="margin-right:2px;"></i>` : '';

                if (task.targetTime) {
                    if (now >= task.targetTime) {
                        li.classList.add('task-ringing');
                        timeHtml = `<span style="font-size:11px; color:#ff5252; margin-left:auto; white-space:nowrap; padding-left:6px; flex-shrink:0;"><i class="ph-bold ph-bell-ringing"></i> 已超时</span>`;
                        if (!task.alerted) { playDing(); task.alerted = true; needsSave = true; }
                    } else {
                        const diffMins = Math.floor((task.targetTime - now) / 60000);
                        let timeStr = '';
                        if (diffMins > 24 * 60) timeStr = `${Math.floor(diffMins / 1440)}天后`;
                        else if (diffMins > 60) timeStr = `${Math.floor(diffMins / 60)}小时后`;
                        else timeStr = `${diffMins}分钟后`;

                        let color = diffMins <= 15 ? '#ff9800' : 'rgba(255,255,255,0.4)';
                        timeHtml = `<span style="font-size:11px; color:${color}; margin-left:auto; white-space:nowrap; padding-left:6px; flex-shrink:0;">${recurIcon}<i class="ph ph-clock"></i> ${timeStr}</span>`;
                        
                        if (task.createdAt) {
                            let total = task.targetTime - task.createdAt; let passed = now - task.createdAt;
                            let percent = Math.min(100, Math.max(0, (passed / total) * 100));
                            let barColor = diffMins <= 15 ? '#ff9800' : 'rgba(74,222,128,0.5)';
                            progressHtml = `<div class="task-progress" style="width:${percent}%; background:${barColor};"></div>`;
                        }
                    }
                } else if (task.recurring) {
                    timeHtml = `<span style="font-size:11px; color:rgba(255,255,255,0.4); margin-left:auto; white-space:nowrap; padding-left:6px; flex-shrink:0;">${recurIcon}每日循环</span>`;
                }

                li.innerHTML = `
                    <div class="checkbox-wrapper"><div class="checkbox"><i class="ph-bold ph-check check-icon"></i></div></div>
                    <div class="task-content"><div class="task-text">${task.text}</div></div>
                    ${timeHtml}
                    <div class="delete-btn" title="删除任务"><i class="ph ph-trash"></i></div>
                    ${progressHtml}
                `;
                bindGlareEffect(li); 
                
                const checkboxWrapper = li.querySelector('.checkbox-wrapper'); const deleteBtn = li.querySelector('.delete-btn');
                const disableDrag = () => li.draggable = false; const enableDrag = () => li.draggable = true;
                checkboxWrapper.addEventListener('mouseenter', disableDrag); checkboxWrapper.addEventListener('mouseleave', enableDrag);
                deleteBtn.addEventListener('mouseenter', disableDrag); deleteBtn.addEventListener('mouseleave', enableDrag);
                
                checkboxWrapper.addEventListener('click', (e) => {
                    e.stopPropagation(); playPop(); li.classList.add('completed', 'jelly-pop');
                    setTimeout(() => { 
                        const t = tasks.find(x => x.id === task.id); 
                        if(t) { 
                            if(t.recurring && t.targetTime) {
                                const historyClone = {...t, id: Date.now() + Math.random(), completed: true, recurring: false};
                                tasks.push(historyClone); t.targetTime += 86400000; t.alerted = false; t.createdAt = Date.now(); 
                            } else { t.completed = true; }
                            saveAndRender(); 
                        } 
                    }, 500);
                });

                deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); tasks = tasks.filter(t => t.id !== task.id); saveAndRender(); });

                const textEl = li.querySelector('.task-text');
                textEl.addEventListener('dblclick', (e) => {
                    e.stopPropagation(); li.draggable = false; 
                    const input = document.createElement('textarea');
                    input.className = 'edit-task-input';
                    input.style.resize = 'none';
                    input.value = task.text;
                    textEl.replaceWith(input);
                    input.focus();
                    
                    const saveEdit = () => {
                        li.draggable = true; 
                        if (input.value.trim() && input.value.trim() !== task.text) {
                            task.text = input.value.trim();
                            const parsed = parseTaskTime(task.text);
                            task.targetTime = parsed.targetTime; task.recurring = parsed.isRecurring;
                            task.alerted = false; task.createdAt = Date.now(); 
                        }
                        saveAndRender();
                    };
                    input.addEventListener('blur', saveEdit);
                    input.addEventListener('keypress', (ev) => { if(ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
                });

                li.addEventListener('dragstart', () => { setTimeout(() => li.classList.add('dragging'), 0); });
                li.addEventListener('dragend', () => { li.classList.remove('dragging'); });
                
                taskListEl.appendChild(li);
            });
            updateOverallProgress();
            if (needsSave) localStorage.setItem('canvas_todo_tasks_notime', JSON.stringify(tasks));
        }

        function renderMinimalistTasks() {
            const miniTaskListEl = document.getElementById('miniTaskList');
            if (!miniTaskListEl) return;
            miniTaskListEl.innerHTML = '';
            const now = Date.now();
            let needsSave = false;

            if (tasks.length === 0) {
                miniTaskListEl.innerHTML = `<div class="empty-state">🍃 暂无日程</div>`;
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item glare-effect' + (task.completed ? ' completed' : '');
                li.dataset.id = task.id;

                let timeHtml = '';
                if (task.targetTime) {
                    if (now >= task.targetTime) {
                        timeHtml = `<span class="mini-badge-orange triggered"><i class="ph-bold ph-bell"></i> 已到时</span>`;
                        if (!task.alerted) { playDing(); task.alerted = true; needsSave = true; }
                    } else {
                        const diffMins = Math.floor((task.targetTime - now) / 60000);
                        let timeStr = '';
                        if (diffMins > 24 * 60) {
                            const days = Math.floor(diffMins / 1440);
                            const hours = Math.floor((diffMins % 1440) / 60);
                            timeStr = `还有${days}天${hours > 0 ? hours + '小时' : ''}`;
                        } else if (diffMins > 60) {
                            const hours = Math.floor(diffMins / 60);
                            const mins = diffMins % 60;
                            timeStr = `还有${hours}小时${mins > 0 ? mins + '分' : ''}`;
                        } else {
                            timeStr = `还有${diffMins}分钟`;
                        }
                        timeHtml = `<span class="mini-badge-orange">${timeStr}</span>`;
                    }
                } else if (task.recurring) {
                    timeHtml = `<span class="mini-badge-orange"><i class="ph-bold ph-arrows-clockwise"></i> 每日循环</span>`;
                }

                li.innerHTML = `
                    <div class="checkbox-wrapper"><div class="checkbox"><i class="ph-bold ph-check check-icon"></i></div></div>
                    <div class="task-content"><div class="task-text">${task.text}</div></div>
                    ${timeHtml}
                    <div class="delete-btn" title="彻底删除"><i class="ph ph-trash"></i></div>
                `;
                bindGlareEffect(li);

                const checkboxWrapper = li.querySelector('.checkbox-wrapper');
                checkboxWrapper.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playPop();
                    task.completed = !task.completed; 
                    if (task.completed && task.recurring && task.targetTime) {
                        const historyClone = {...task, id: Date.now() + Math.random(), completed: true, recurring: false};
                        tasks.push(historyClone);
                        task.targetTime += 86400000;
                        task.alerted = false;
                        task.createdAt = Date.now();
                    }
                    saveAndRender();
                });

                const deleteBtn = li.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    tasks = tasks.filter(t => t.id !== task.id);
                    saveAndRender();
                });

                const textEl = li.querySelector('.task-text');
                textEl.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    const input = document.createElement('textarea');
                    input.className = 'edit-task-input';
                    input.style.resize = 'none';
                    input.value = task.text;
                    textEl.replaceWith(input);
                    input.focus();
                    
                    const saveEdit = () => {
                        if (input.value.trim() && input.value.trim() !== task.text) {
                            task.text = input.value.trim();
                            const parsed = parseTaskTime(task.text);
                            task.targetTime = parsed.targetTime;
                            task.recurring = parsed.isRecurring;
                            task.alerted = false;
                            task.createdAt = Date.now();
                        }
                        saveAndRender();
                    };
                    input.addEventListener('blur', saveEdit);
                    input.addEventListener('keypress', (ev) => { if(ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
                });

                miniTaskListEl.appendChild(li);
            });

            if (needsSave) localStorage.setItem('canvas_todo_tasks_notime', JSON.stringify(tasks));
        }

        taskListEl.addEventListener('dragover', e => {
            e.preventDefault();
            const afterElement = getDragAfterElement(taskListEl, e.clientY);
            const draggable = document.querySelector('.dragging');
            if(draggable) {
                if (afterElement == null) taskListEl.appendChild(draggable); else taskListEl.insertBefore(draggable, afterElement);
            }
        });
        
        taskListEl.addEventListener('dragend', e => {
            const currentIds = Array.from(taskListEl.querySelectorAll('.task-item')).map(item => parseInt(item.dataset.id));
            const activeTasks = currentIds.map(id => tasks.find(t => t.id === id)).filter(t => t);
            const completedTasks = tasks.filter(t => t.completed);
            tasks = [...activeTasks, ...completedTasks];
            saveAndRender();
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.task-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect(); const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child }; else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        setInterval(() => { renderTasks(); renderMinimalistTasks(); }, 15000);

        function renderHistoryTasks() {
            historyListEl.innerHTML = '';
            const completedTasks = tasks.filter(t => t.completed);
            if (completedTasks.length === 0) { historyListEl.innerHTML = `<div class="empty-gallery"><i class="ph ph-wind" style="font-size: 32px;"></i><span>空空如也，暂无已完成的历史</span></div>`; return; }
            completedTasks.forEach(task => {
                const li = document.createElement('li'); li.className = 'task-item completed';
                li.innerHTML = `<div class="checkbox-wrapper"><div class="checkbox"><i class="ph-bold ph-check check-icon"></i></div></div><div class="task-content"><div class="task-text">${task.text}</div></div><div class="delete-btn" title="彻底删除"><i class="ph ph-trash"></i></div>`;
                li.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-btn')) { tasks = tasks.filter(t => t.id !== task.id); saveAndRender(); return; }
                    const t = tasks.find(t => t.id === task.id); 
                    if(t) { t.completed = false; saveAndRender(); }
                });
                historyListEl.appendChild(li);
            });
            updateOverallProgress();
        }

        function saveAndRender() { 
            localStorage.setItem('canvas_todo_tasks_notime', JSON.stringify(tasks)); 
            renderTasks(); 
            renderMinimalistTasks();
            if(historyModal.classList.contains('show')) { renderHistoryTasks(); }
        }
        
        addTaskBtn.addEventListener('click', (e) => {
            if (inputContainer.classList.contains('show')) { 
                inputContainer.classList.remove('show'); 
            } else { 
                inputContainer.classList.add('show'); 
                taskInput.focus(); 
            }
        });
        
        taskInput.addEventListener('blur', () => {
            setTimeout(() => {
                if (taskInput.value.trim() === '') {
                    inputContainer.classList.remove('show');
                }
            }, 100); 
        });
        
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = taskInput.value.trim();
                if (text) { 
                    playPop(); 
                    const parsed = parseTaskTime(text);
                    tasks.unshift({ 
                        id: Date.now(), text: text, completed: false, createdAt: Date.now(),
                        targetTime: parsed.targetTime, recurring: parsed.isRecurring, alerted: false
                    }); 
                    taskInput.value = ''; inputContainer.classList.remove('show'); saveAndRender(); setTimeout(() => document.getElementById('listContainer').scrollTop = 0, 50); 
                }
            }
        });

        const miniAddTaskBtn = document.getElementById('miniAddTaskBtn');
        const miniInputContainer = document.getElementById('miniInputContainer');
        const miniTaskInput = document.getElementById('miniTaskInput');

        miniAddTaskBtn.addEventListener('click', () => {
            if (miniInputContainer.classList.contains('show')) {
                miniInputContainer.classList.remove('show');
            } else {
                miniInputContainer.classList.add('show');
                miniTaskInput.focus();
            }
        });

        miniTaskInput.addEventListener('blur', () => {
            setTimeout(() => {
                if (miniTaskInput.value.trim() === '') {
                    miniInputContainer.classList.remove('show');
                }
            }, 100);
        });

        miniTaskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = miniTaskInput.value.trim();
                if (text) {
                    playPop();
                    const parsed = parseTaskTime(text);
                    tasks.unshift({
                        id: Date.now(), text: text, completed: false, createdAt: Date.now(),
                        targetTime: parsed.targetTime, recurring: parsed.isRecurring, alerted: false
                    });
                    miniTaskInput.value = '';
                    miniInputContainer.classList.remove('show');
                    saveAndRender();
                    setTimeout(() => document.getElementById('miniListContainer').scrollTop = 0, 50);
                }
            }
        });
        
        renderTasks();
        renderMinimalistTasks();
        
        document.getElementById('immersiveStopBtn').addEventListener('click', togglePomodoro);

        let selectOpen = false;
        
        document.querySelectorAll('select').forEach(sel => {
            sel.addEventListener('mousedown', () => {
                selectOpen = true;
                if (typeof ipcRenderer !== 'undefined') ipcRenderer.send('dropdown-state', true);
            });
            
            sel.addEventListener('change', () => {
                selectOpen = false;
                sel.blur(); 
                if (typeof ipcRenderer !== 'undefined') ipcRenderer.send('dropdown-state', false);
            });
            
            sel.addEventListener('blur', () => {
                selectOpen = false;
                if (typeof ipcRenderer !== 'undefined') ipcRenderer.send('dropdown-state', false);
            });
        });

        window.addEventListener('blur', () => {
            if (selectOpen) {
                selectOpen = false;
                if (typeof ipcRenderer !== 'undefined') ipcRenderer.send('dropdown-state', false);
            }
        });
    </script>
